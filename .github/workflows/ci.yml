name: CI

on:
  workflow_dispatch:

jobs:
  build-and-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Flake check
        run: nix flake check

      - name: Run test suite
        run: ./tests/validate.sh

      - name: Build configs for Windows testing
        run: |
          mkdir -p built-configs
          cp "$(nix build .#example --json | jq -r '.[0].outputs.out')" built-configs/example-webserver.yaml
          cp "$(nix build .#exampleWorkstation --json | jq -r '.[0].outputs.out')" built-configs/example-workstation.yaml
          cp "$(nix build .#exampleNative --json | jq -r '.[0].outputs.out')" built-configs/example-native.yaml

      - name: Upload configs
        uses: actions/upload-artifact@v4
        with:
          name: dsc-configs
          path: built-configs/*.yaml

  test-windows:
    runs-on: windows-latest
    needs: build-and-test-linux
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsc-configs
          path: configs

      - name: Download DSC v3 for Windows
        shell: pwsh
        run: |
          $url = "https://github.com/PowerShell/DSC/releases/download/v3.1.0/DSC-3.1.0-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile dsc.zip
          Expand-Archive -Path dsc.zip -DestinationPath dsc

      - name: Test configs on Windows
        shell: pwsh
        run: |
          $dsc = "dsc/dsc.exe"
          $fail = $false
          Get-ChildItem configs -Filter "*.yaml" | ForEach-Object {
              $name = $_.Name
              Write-Host "`n=== $name ==="

              # validate — parse JSON result, don't trust exit code alone
              $raw = & $dsc config validate -f $_.FullName -o pretty-json 2>&1 | Out-String
              # Strip ANSI escape codes
              $raw = $raw -replace '\x1b\[[0-9;]*[mK]', ''
              # Extract the JSON object (everything from first { to last })
              $jsonText = [regex]::Match($raw, '(?s)\{.*\}').Value
              try {
                  $json = $jsonText | ConvertFrom-Json
                  if ($json.valid -eq $true) {
                      Write-Host "  validate: PASS"
                  } elseif ($raw -match "Resource type not found|Resource not found") {
                      Write-Host "  validate: PASS (structurally valid; resource not found)"
                  } else {
                      Write-Host "  validate: FAIL"
                      Write-Host $raw
                      $fail = $true
                  }
              } catch {
                  Write-Host "  validate: FAIL (could not parse output)"
                  Write-Host $raw
                  $fail = $true
              }

              # get — informational; may need PowerShell modules for legacy resources
              $getRaw = & $dsc config get -f $_.FullName -o pretty-json 2>&1 | Out-String
              $getCode = $LASTEXITCODE
              if ($getCode -eq 0) {
                  Write-Host "  get: PASS"
              } else {
                  Write-Host "  get: SKIP/FAIL (exit $getCode; output below)"
                  Write-Host ($getRaw -replace '\x1b\[[0-9;]*[mK]', '')
              }

              # test — informational; may need PowerShell modules for legacy resources
              $testRaw = & $dsc config test -f $_.FullName -o pretty-json 2>&1 | Out-String
              $testCode = $LASTEXITCODE
              if ($testCode -eq 0) {
                  Write-Host "  test: PASS"
              } else {
                  Write-Host "  test: SKIP/FAIL (exit $testCode; output below)"
                  Write-Host ($testRaw -replace '\x1b\[[0-9;]*[mK]', '')
              }
          }

          if ($fail) { exit 1 }